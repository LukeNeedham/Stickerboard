name: On Pull Request

on:
    workflow_call: # Makes sure this job can be acted.
    workflow_dispatch: {}
    pull_request:
        # "labeled" lets adding the "perf" label build the perf APK without needing a new push
        types: [opened, synchronize, reopened, labeled]
        branches:
            # The following branches are worth running the checks on
            - main

# Cancel in-progress runs for the same PR/branch — only the latest push matters
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write       # write to allow creating Releases
  pull-requests: write  # So we can write comments from the workflow

jobs:
    # Run the gradle build -
    # this job handles all the work related to the outputs of the gradle build,
    # so we don't have to pass large files between jobs.
    build:
        # Adding an unrelated label shouldn't trigger a whole build
        if: github.event.action != 'labeled' || github.event.label.name == 'perf'
        runs-on: ubuntu-latest
        env:
            # Perf APKs are built on demand only: put the "perf" label on the PR
            BUILD_PERF: ${{ contains(github.event.pull_request.labels.*.name, 'perf') }}

        steps:
          - uses: actions/checkout@v4

          # Setup Java
          - name: set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'zulu'

          # Setup Gradle with build caching (caches build outputs, not just downloaded dependencies)
          - name: Setup Gradle
            uses: gradle/actions/setup-gradle@v4
            with:
              cache-read-only: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

          # Build debug apk, plus (only with the "perf" PR label) a non-debuggable "perf" apk
          # for judging scroll performance
          - name: Run CLI - Build
            shell: bash
            run: |
              TASKS="assembleDebug"
              if [ "$BUILD_PERF" = "true" ]; then TASKS="$TASKS assemblePerf"; fi
              ./gradlew $TASKS --no-daemon --build-cache

          # Locate the built apk, since its filename is derived from the app version
          - name: Locate built APK
            id: locate-apk
            run: |
              APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
              echo "path=$APK_PATH" >> $GITHUB_OUTPUT
              echo "name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT

          - name: Locate built perf APK
            id: locate-perf-apk
            if: env.BUILD_PERF == 'true'
            run: |
              APK_PATH=$(find app/build/outputs/apk/perf -name '*.apk' | head -n 1)
              echo "path=$APK_PATH" >> $GITHUB_OUTPUT
              echo "name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT

          # Set time we can timestamp messages
          - name: Set current time
            run: |
              echo "CURRENT_TIME=$(TZ='Europe/Amsterdam' date +'%d/%m/%Y %H:%M:%S')" >> $GITHUB_ENV

          - name: Generate Release Tag
            id: generate-tag
            run: |
              # Use head_ref for PRs, fallback to ref_name for manual dispatches
              RAW_BRANCH="${{ github.head_ref || github.ref_name }}"

              # Replace slashes and special characters with dashes, convert to lowercase
              CLEAN_BRANCH=$(echo "$RAW_BRANCH" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')

              # Combine branch name with run identifiers
              TAG_NAME="${CLEAN_BRANCH}-${{ github.run_number }}-${{ github.run_attempt }}"

              echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

          # Extra PR comment text, only present when a perf APK was built
          - name: Compose perf APK comment
            if: env.BUILD_PERF == 'true'
            run: |
              {
                echo "PERF_COMMENT<<EOF"
                echo "Perf (non-debuggable, for judging scroll smoothness) apk at:"
                echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.generate-tag.outputs.tag }}/${{ steps.locate-perf-apk.outputs.name }}"
                echo "EOF"
              } >> "$GITHUB_ENV"

          # Create a unique GitHub Release and upload the APK
          - name: Create Release and Upload APK
            id: create-release
            uses: ncipollo/release-action@v1
            with:
              artifacts: "${{ steps.locate-apk.outputs.path }}${{ steps.locate-perf-apk.outputs.path && format(',{0}', steps.locate-perf-apk.outputs.path) || '' }}"
              tag: ${{ steps.generate-tag.outputs.tag }}
              name: "PR Build: ${{ github.head_ref || github.ref_name }}"
              body: "Debug build generated automatically from branch: ${{ github.head_ref || github.ref_name }} at ${{ env.CURRENT_TIME }}"
              prerelease: true
              draft: false

          # Write a comment on the PR with the direct download link to the release asset
          - name: Write Example APK comment
            uses: marocchino/sticky-pull-request-comment@v3
            with:
              header: example-app-link
              message: |
                App apk at:
                https://github.com/${{ github.repository }}/releases/download/${{ steps.generate-tag.outputs.tag }}/${{ steps.locate-apk.outputs.name }}

                ${{ env.PERF_COMMENT }}

                * **Triggered by:** PR Commit `${{ github.sha }}`
                * **Built at:** ${{ env.CURRENT_TIME }}
