pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://lukeneedham.github.io/ci-workflows/maven")
            content { includeGroup("com.lukeneedham") } // only ask it for the shared library
        }
    }
}
rootProject.name = "StickerBoard"
include ':app'
